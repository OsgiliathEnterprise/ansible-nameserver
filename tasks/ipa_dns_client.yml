---


- name: Ipa_dns_client | debug input params
  ansible.builtin.debug:
    msg: "Params for dns entry. Zone: {{ company_domain }}, Record name: {{ (hostname | default(nameserver_current_host)) | replace('.' + company_domain, '') }}, Record IP: {{ nameserver_current_host_ip }}, PTR Zone: {{ nameserver_current_host_ip.split('.')[:nameserver_reverse_zone_prefix // 8][::-1] | join('.') }}.in-addr.arpa"
    verbosity: 1

- name: Ipa_dns_client | ensure client's own reverse zone is created
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ company_realm_password }}"
    name_from_ip: "{{ nameserver_current_host_ip | ansible.utils.ipsubnet(nameserver_reverse_zone_prefix) }}"
    ipaapi_context: server
    state: present
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group][0] }}"

- name: Ipa_dns_client | remove potentially outdated ptr entries
  ansible.builtin.include_tasks: delete-outdated-ptr.yml

- name: Ipa_dns_client | ensure dns entry is created
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    ipaapi_context: server
    zone_name: "{{ company_domain }}"
    name: "{{ nameserver_current_host | replace('.' + company_domain, '') }}"
    a_rec: "{{ nameserver_current_host_ip }}"
    state: present
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group][0] }}"

- name: Ipa_dns_client | ensure reverse dns entry is created
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    ipaapi_context: server
    zone_name: "{{ nameserver_current_host_ip.split('.')[:nameserver_reverse_zone_prefix // 8][::-1] | join('.') }}.in-addr.arpa"
    record_type: PTR
    ptr_hostname: "{{ nameserver_current_host | replace('.' + company_domain, '') }}"
    name: "{{ nameserver_current_host_ip.split('.')[nameserver_reverse_zone_prefix // 8:][::-1] | join('.') }}"
    state: present
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group][0] }}"
