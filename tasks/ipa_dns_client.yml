---


- name: Ipa_dns_client | debug input params
  ansible.builtin.debug:
    msg: "Params for dns entry. Zone: {{ company_domain }}, Record name: {{ (hostname | default(nameserver_current_host)) | replace('.' + company_domain, '') }}, Record IP: {{ nameserver_current_host_ip }}, PTR: {{ nameserver_current_host_ip | ansible.utils.ipaddr('revdns') | replace('.in-addr.arpa.', '') | ansible.utils.ipsubnet(24) | replace('.0/24', '') }}"
    verbosity: 1

- name: Ipa_dns_client | remove potentially outdated ptr entries
  ansible.builtin.include_tasks: delete-outdated-ptr.yml

- name: Ipa_dns_client | ensure dns entry is created
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    ipaapi_context: server
    zone_name: "{{ company_domain }}"
    name: "{{ nameserver_current_host | replace('.' + company_domain, '') }}"
    a_rec: "{{ nameserver_current_host_ip }}"
    create_reverse: yes
    state: present
  failed_when: False # don't know from where comes this sh****tty error, still, it works, even with a timeout as a response
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group][0] }}"

- name: Ipa_dns_client | ensure reverse dns entry is created
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ company_realm_password }}"
    ipaapi_context: server
    zone_name: "{{ nameserver_current_host_ip | ansible.utils.ipsubnet(24) | ansible.utils.ipaddr('revdns') | regex_replace('^0\\.', '') | regex_replace('\\.$', '') }}"
    record_type: PTR
    ptr_hostname: "{{ nameserver_current_host | replace('.' + company_domain, '') }}"
    name: "{{ nameserver_current_host_ip.split('.')[-1] }}"
    state: present
  failed_when: False # May have been created above
  no_log: "{{ secure_logs }}"
  delegate_to: "{{ groups[idm_group][0] }}"
