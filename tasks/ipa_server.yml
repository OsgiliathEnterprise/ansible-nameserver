---

# Assuming all client machines are in the same domain and same /8 subnet , we can use the company_domain variable to set the dns zone.
- name: Ipa_server | ensure reverse zone is created
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ company_realm_password }}"
    name_from_ip: "{{ nameserver_current_host_ip | ansible.utils.ipsubnet(nameserver_reverse_zone_prefix) }}"
    ipaapi_context: server
    state: present
  no_log: "{{ secure_logs }}"
  register: ptr_zone

- name: Ipa_server | Display ptr zone name.
  ansible.builtin.debug:
    msg: "PTR Zone: {{ nameserver_current_host_ip.split('.')[:nameserver_reverse_zone_prefix // 8][::-1] | join('.') }}.in-addr.arpa"
    verbosity: 1

- name: Ipa_server | Display ptr zone name.
  ansible.builtin.debug:
    msg: "PTR Zone: {{ ptr_zone }}"

- name: Ipa_server | allow ptr sync on dns zone
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ company_realm_password }}"
    name: "{{ company_domain }}"
    allow_sync_ptr: true
    ipaapi_context: server
    state: present
  no_log: "{{ secure_logs }}"
